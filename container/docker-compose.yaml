volumes:
  postgres_data:
  redis_data:
  n8n_data:
  letsencrypt_data:
  chatwoot_data:
  evolution_data:
  pgvector_data:

networks:
  n8n-network:
    driver: bridge

x-logging: &default-logging
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"
  driver: json-file

x-shared:
  &n8n-common
  image: n8nio/n8n:1.100.1
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=${POSTGRES_HOST}
    - DB_POSTGRESDB_PORT=${POSTGRES_PORT}
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - QUEUE_MODE=redis
    - QUEUE_REDIS_HOST=redis
    - QUEUE_REDIS_PORT=6379
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    - TZ=${GENERIC_TIMEZONE}
    - N8N_ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - N8N_HOST=10.221.186.19
    - N8N_SECURE_COOKIE=false
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    # - WEBHOOK_URL=https://${N8N_HOST}
    - N8N_QUEUE_TYPE=redis
    - N8N_QUEUE_HOST=redis
    - N8N_QUEUE_PORT=6379
    - N8N_QUEUE_NAME=n8n
    - N8N_COMMUNITY_PACKAGES_ENABLED=true
    - N8N_REINSTALL_MISSING_PACKAGES=true
    - N8N_RUNNERS_ENABLED=true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - n8n_data:/home/node/.n8n
  networks:
    - n8n-network
  logging: *default-logging

services:
  # traefik:
  #   image: traefik:v3.4.3
  #   container_name: traefik
  #   command:
  #     - "--api.insecure=true"
  #     - "--providers.docker=true"
  #     - "--providers.docker.exposedbydefault=false"
  #     - "--entrypoints.web.address=:80"
  #     - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
  #     - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
  #     - "--entrypoints.websecure.address=:443"
  #     - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
  #     - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
  #     - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - letsencrypt_data:/letsencrypt
  #   environment:
  #     - GENERIC_TIMEZONE=America/Sao_Paulo
  #     - SSL_EMAIL
  #   networks:
  #     - n8n-network
  #   logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
     - 5432:5432    
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    command: -p 5433
    ports:
     - 5433:5433
    restart: always
    networks:
      - n8n-network      
    environment:
      - POSTGRES_DB=${VECTOR_POSTGRES_DB}
      - POSTGRES_USER=${VECTOR_POSTGRES_USER}
      - POSTGRES_PASSWORD=${VECTOR_POSTGRES_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=${VECTOR_POSTGRES_HOST_AUTH_METHOD}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      
    volumes:
     # - ./pgvector-init.sql:/docker-entrypoint-initdb.d/init.sql
     - pgvector_data:/var/lib/postgresql/data
    logging: *default-logging

  redis:
    image: redis:alpine
    container_name: redis
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
    volumes:
      - redis_data:/data
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  n8n-import:
    hostname: n8n-import
    container_name: n8n-import
    entrypoint: /bin/sh
    command:
      - "-c"
      - "n8n import:credentials --separate --input=/backup/credentials && n8n import:workflow --separate --input=/backup/workflows"
    volumes:
      - ./n8n/backup:/backup
    depends_on:
      postgres:
        condition: service_healthy
    <<: *n8n-common

  n8n-master:
    container_name: n8n-master
    command: start
    ports:
      - 5678:5678    
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.n8n.rule=Host(`n8n.dockervm`)"
    #   - "traefik.http.routers.n8n.entrypoints=websecure"
    #   - "traefik.http.routers.n8n.tls=true"
    #   - "traefik.http.routers.n8n.tls.certresolver=mytlschallenge"
    #   - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    <<: *n8n-common

  n8n-worker:
    container_name: n8n-worker
    command: worker
    <<: *n8n-common

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy  
    ports:
      - 8080:8080
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - n8n-network
  #   # labels:
  #   #   - "traefik.enable=true"
  #   #   - "traefik.http.routers.evolution.rule=Host(`evolution.dockervm`)"
  #   #   - "traefik.http.routers.evolution.entrypoints=websecure"
  #   #   - "traefik.http.routers.evolution.tls=true"
  #   #   - "traefik.http.routers.evolution.tls.certresolver=mytlschallenge"
  #   #   - "traefik.http.services.evolution.loadbalancer.server.port=8080"
    logging: *default-logging 
    environment:
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - LANGUAGE=${LANGUAGE}
      - CONFIG_SESSION_PHONE_CLIENT=${CONFIG_SESSION_PHONE_CLIENT}
      - CONFIG_SESSION_PHONE_NAME=chrome
      - CONFIG_SESSION_PHONE_VERSION=${CONFIG_SESSION_PHONE_VERSION}
      - WA_BUSINESS_TOKEN_WEBHOOK=evolution
      - WA_BUSINESS_URL=https://graph.facebook.com
      - WA_BUSINESS_VERSION=v20.0
      - WA_BUSINESS_LANGUAGE=${WA_BUSINESS_LANGUAGE}
      - QRCODE_LIMIT=1902
      - QRCODE_COLOR=#000000
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - OPENAI_ENABLED=false
      - DIFY_ENABLED=false
      - S3_ENABLED=false
      - S3_ACCESS_KEY=
      - S3_SECRET_KEY=
      - S3_BUCKET=evolution
      - S3_PORT=443
      - S3_ENDPOINT=
      - S3_USE_SSL=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/2
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
      - DEL_INSTANCE=2
      - DEL_TEMP_INSTANCES=false
      - TYPEBOT_ENABLED=true
      - TYPEBOT_API_VERSION=latest
      - CHATWOOT_ENABLED=false
      - CHATWOOT_MESSAGE_READ=true
      - CHATWOOT_MESSAGE_DELETE=true
      - CHATWOOT_IMPORT_DATABASE_CONNECTION_URI=postgresql://n8n:n8n_password@n8n:5432/chatwoot?sslmode=disable
      - CHATWOOT_IMPORT_PLACEHOLDER_MEDIA_MESSAGE=false
      - RABBITMQ_ENABLED=false
      - RABBITMQ_URI=amqp://admin:admin@rabbitmq:5672/default
      - RABBITMQ_EXCHANGE_NAME=evolution
      - RABBITMQ_GLOBAL_ENABLED=false
      - RABBITMQ_EVENTS_APPLICATION_STARTUP=false
      - RABBITMQ_EVENTS_INSTANCE_CREATE=false
      - RABBITMQ_EVENTS_INSTANCE_DELETE=false
      - RABBITMQ_EVENTS_QRCODE_UPDATED=false
      - RABBITMQ_EVENTS_MESSAGES_SET=false
      - RABBITMQ_EVENTS_MESSAGES_UPSERT=true
      - RABBITMQ_EVENTS_MESSAGES_EDITED=false
      - RABBITMQ_EVENTS_MESSAGES_UPDATE=false
      - RABBITMQ_EVENTS_MESSAGES_DELETE=false
      - RABBITMQ_EVENTS_SEND_MESSAGE=false
      - RABBITMQ_EVENTS_CONTACTS_SET=false
      - RABBITMQ_EVENTS_CONTACTS_UPSERT=false
