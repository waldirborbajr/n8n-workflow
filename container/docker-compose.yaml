  #   logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
     - 5432:5432    
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    command: -p 5433
    ports:
     - 5433:5433
    restart: always
    networks:
      - n8n-network      
    environment:
      - POSTGRES_DB=${VECTOR_POSTGRES_DB}
      - POSTGRES_USER=${VECTOR_POSTGRES_USER}
      - POSTGRES_PASSWORD=${VECTOR_POSTGRES_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=${VECTOR_POSTGRES_HOST_AUTH_METHOD}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      
    volumes:
     # - ./pgvector-init.sql:/docker-entrypoint-initdb.d/init.sql
     - pgvector_data:/var/lib/postgresql/data
    logging: *default-logging

  redis:
    image: redis:alpine
    container_name: redis
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
    volumes:
      - redis_data:/data
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  n8n-import:
    hostname: n8n-import
    container_name: n8n-import
    entrypoint: /bin/sh
    command:
      - "-c"
      - "n8n import:credentials --separate --input=/backup/credentials && n8n import:workflow --separate --input=/backup/workflows"
    volumes:
      - ./n8n/backup:/backup
    depends_on:
      postgres:
        condition: service_healthy
    <<: *n8n-common

  n8n-master:
    container_name: n8n-master
    command: start
    ports:
      - 5678:5678    
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.n8n.rule=Host(`n8n.dockervm`)"
    #   - "traefik.http.routers.n8n.entrypoints=websecure"
    #   - "traefik.http.routers.n8n.tls=true"
    #   - "traefik.http.routers.n8n.tls.certresolver=mytlschallenge"
    #   - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    <<: *n8n-common

  n8n-worker:
    container_name: n8n-worker
    command: worker
    <<: *n8n-common

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy    
    ports:
      - 8080:8080
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - evolution-net
    environment:
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@postgres:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_exchange
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true    
      - AUTHENTICATION_API_KEY=your-evolution-api-key
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      
